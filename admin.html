<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel de confirmaciones — Natalia & Emanuel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f4ee;--paper:#fffdf9;--ink:#242321;--muted:#716d66;--line:rgba(36,35,33,.12);--green:#4f6f5c;--green-d:#2b4338;--yes:#3d7a56;--no:#a35a52;--wait:#a39a8a;--lav:#5b68b4}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Montserrat,system-ui,sans-serif;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
    main{max-width:980px;margin:0 auto}
    h1{font:italic 500 38px/1.1 'Cormorant Garamond',serif;margin:12px 0 4px}
    h2{font:500 22px 'Cormorant Garamond',serif;margin:28px 0 10px}
    p{margin:0 0 12px;color:var(--muted)}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}
    form{display:flex;gap:10px;flex-wrap:wrap}
    input[type=password],input[type=search]{flex:1 1 220px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
    button{font:500 13px Montserrat,sans-serif;letter-spacing:.04em;border:0;border-radius:10px;padding:12px 18px;background:var(--green);color:#fff;cursor:pointer}
    button:hover{background:var(--green-d)} button[disabled]{opacity:.6;cursor:default}
    button.ghost{background:transparent;color:var(--green-d);border:1px solid var(--line)}
    .err{color:var(--no);min-height:1.4em;margin:10px 0 0}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
    .stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
    .stat b{display:block;font:500 40px/1 'Cormorant Garamond',serif;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
    .stat span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
    .stat.main b{color:var(--yes)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .chip{padding:8px 12px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;font-size:12px}
    .chip[aria-pressed=true]{background:var(--ink);color:#fff}
    .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
    table{border-collapse:collapse;width:100%;min-width:560px}
    th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
    th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
    tr:last-child td{border-bottom:0}
    .pin{font-variant-numeric:tabular-nums;letter-spacing:.1em}
    .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
    .tag.pay{color:var(--lav);border-color:rgba(91,104,180,.4)}
    .st{display:inline-block;margin:0 8px 2px 0;white-space:nowrap}
    .st::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--wait)}
    .st.si::before{background:var(--yes)} .st.no::before{background:var(--no)}
    .guestline{display:block}
    .small{font-size:12px}
    .cat{display:block;font-size:11px;color:var(--muted);margin-top:2px}
    .diet-line,.msg{display:block;font-size:12px;color:var(--muted);margin:0 0 2px 14px}
    .msg{font-family:'Montserrat',sans-serif}
    .pay-btn{display:block;margin-top:6px;padding:5px 10px;font-size:11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
    .pay-btn.paid{background:var(--yes);color:#fff;border-color:var(--yes)}
    .wa{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:12px;white-space:nowrap}
    .phone-btn{padding:5px 10px;font-size:11px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <h1>Confirmaciones</h1>
  <p>Panel privado de Natalia y Emanuel.</p>

  <section id="login" class="card">
    <form id="loginForm">
      <input id="adminKey" type="password" autocomplete="current-password" placeholder="Clave de administración" aria-label="Clave de administración" required>
      <button id="loginBtn" type="submit">Entrar</button>
    </form>
    <p id="loginErr" class="err" aria-live="polite"></p>
    <small id="demoNote" class="small" hidden>La página todavía no está conectada a la base (falta completar js/config.js).</small>
  </section>

  <section id="panel" hidden>
    <div class="stats" id="stats"></div>

    <h2>Invitaciones</h2>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Buscar por nombre, grupo o código" aria-label="Buscar">
      <div class="chips" id="chips">
        <button class="chip" type="button" data-f="all" aria-pressed="true">Todos</button>
        <button class="chip" type="button" data-f="si" aria-pressed="false">Confirmaron</button>
        <button class="chip" type="button" data-f="no" aria-pressed="false">No asisten</button>
        <button class="chip" type="button" data-f="pend" aria-pressed="false">Sin responder</button>
        <button class="chip" type="button" data-f="unpaid" aria-pressed="false">Falta pagar</button>
      </div>
      <button id="reload" class="ghost" type="button">Actualizar</button>
      <button id="csv" class="ghost" type="button">Descargar Excel (CSV)</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Código</th><th>Grupo</th><th>Tarjeta</th><th>Respuestas</th><th>Enviar</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="small" id="updated" style="margin-top:10px"></p>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
